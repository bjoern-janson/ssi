name: SSI-CALC HF2-24 Freeze Verify

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/ssi_calc/v0_1/fresh2/**'
      - '.github/workflows/ssi-calc-hf2-24-freeze-verify.yml'

permissions:
  contents: read

jobs:
  verify-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify HF2-24 hashes and structure only
        run: python research/ssi_calc/v0_1/fresh2/verify_hf2_24.py
