name: K1 Compiler Freeze Verify

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/ssi_calc/compiler/k1/compiler/**'
      - '.github/workflows/k1-compiler-freeze-verify.yml'

permissions:
  contents: read

jobs:
  verify-compiler-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild K1 IR without executing R2 tasks
        run: python research/ssi_calc/compiler/k1/compiler/verify_compiler_freeze.py
