name: K1 Source Judgment vs Proof Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/ssi_calc/compiler/k1/audit/diagnose_source_judgment_vs_proof.py'
      - '.github/workflows/k1-source-proof-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Separate frozen R2 judgment reproducibility from proof reproducibility
        run: python research/ssi_calc/compiler/k1/audit/diagnose_source_judgment_vs_proof.py
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k1-source-judgment-vs-proof-diagnostic
          path: research/ssi_calc/compiler/k1/audit/SOURCE_JUDGMENT_VS_PROOF_DIAGNOSTIC.json
