name: SSI-CALC HF2-24 First Exposure

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/ssi_calc/v0_1/fresh2/run_hf2_24.py'
      - '.github/workflows/ssi-calc-hf2-24-first-exposure.yml'

permissions:
  contents: read

jobs:
  first-exposure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r research/ssi_calc/v0_1/requirements.txt
      - name: Execute frozen successor-v2 on frozen HF2-24
        run: python research/ssi_calc/v0_1/fresh2/run_hf2_24.py
      - name: Upload immutable first result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hf2-24-first-run
          path: research/ssi_calc/v0_1/fresh2/HF2_24_FIRST_RUN.json
