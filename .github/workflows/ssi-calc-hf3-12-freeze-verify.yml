name: SSI-CALC HF3-12 Freeze Verify

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/ssi_calc/v0_1/fresh3/**'
      - '.github/workflows/ssi-calc-hf3-12-freeze-verify.yml'

permissions:
  contents: read

jobs:
  verify-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify HF3-12 hashes and structure only
        run: python research/ssi_calc/v0_1/fresh3/verify_hf3_12.py
