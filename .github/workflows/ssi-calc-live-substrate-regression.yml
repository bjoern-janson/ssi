name: SSI-CALC Live Authority Substrate Regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/ssi_calc/v0_1/checker_live.py'
      - 'research/ssi_calc/v0_1/fresh/run_live_substrate_regression.py'
      - '.github/workflows/ssi-calc-live-substrate-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r research/ssi_calc/v0_1/requirements.txt
      - name: Run B64 + H24 + HF16 regression
        run: python research/ssi_calc/v0_1/fresh/run_live_substrate_regression.py
      - name: Upload full result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-substrate-regression-result
          path: research/ssi_calc/v0_1/fresh/LIVE_SUBSTRATE_REGRESSION_RESULT.json
