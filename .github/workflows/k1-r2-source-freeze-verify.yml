name: K1 R2 Source Freeze Verify

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/ssi_calc/compiler/k1/source/**'
      - '.github/workflows/k1-r2-source-freeze-verify.yml'

permissions:
  contents: read

jobs:
  verify-source-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen R2 source semantics only
        run: python research/ssi_calc/compiler/k1/source/verify_source_freeze.py
