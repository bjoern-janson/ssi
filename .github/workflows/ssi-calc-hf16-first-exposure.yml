name: SSI-CALC HF16 First Exposure

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/ssi_calc/v0_1/fresh/run_hf16.py'
      - '.github/workflows/ssi-calc-hf16-first-exposure.yml'

permissions:
  contents: read

jobs:
  first-exposure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r research/ssi_calc/v0_1/requirements.txt
      - name: Execute frozen successor on frozen HF16
        run: python research/ssi_calc/v0_1/fresh/run_hf16.py
      - name: Upload immutable first result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hf16-first-run
          path: research/ssi_calc/v0_1/fresh/HF16_FIRST_RUN.json
