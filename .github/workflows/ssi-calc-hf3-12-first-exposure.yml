name: SSI-CALC HF3-12 First Exposure

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/ssi_calc/v0_1/fresh3/run_hf3_12.py'
      - '.github/workflows/ssi-calc-hf3-12-first-exposure.yml'

permissions:
  contents: read

jobs:
  first-exposure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r research/ssi_calc/v0_1/requirements.txt
      - name: Execute frozen successor-v3 on frozen HF3-12
        run: python research/ssi_calc/v0_1/fresh3/run_hf3_12.py
      - name: Upload immutable first result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hf3-12-first-run
          path: research/ssi_calc/v0_1/fresh3/HF3_12_FIRST_RUN.json
